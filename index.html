<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#065f46" />
  <meta name="description" content="Sistem Absensi Digital Siswa, Guru, dan Tenaga Kependidikan MA Nahdhiyah Talun." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <title>E-Absensi MA Nahdhiyah Talun</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js" defer></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; margin: 0; }
    #qr-reader video { border-radius: 1rem; object-fit: cover; }
    @media print { .no-print { display: none !important; } body { background: white !important; } }
  </style>
</head>
<body class="text-slate-800 antialiased">
<div id="app"></div>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
const STORAGE_KEY = 'e_absensi_mnt_v2_9_ghpages';
const defaultData = {
  school: { name: 'MA Nahdhiyah Talun', shortCode: 'MNT', npsn: '20364812', jamMasuk: '07:00', toleransiMenit: 15, jamPulang: '14:30', kioskPin: '123456' },
  users: [
    { id: 'admin', pin: '1234', name: 'Operator Madrasah', role: 'admin', refId: 'PEG-001' },
    { id: 'piket', pin: '1234', name: 'Ust. Syamsul Maarif (Piket)', role: 'piket', refId: 'PEG-002' },
    { id: 'walikelas', pin: '1234', name: 'Ustzh. Siti Aminah, S.Pd', role: 'walikelas', refId: 'PEG-003', kelasBinaan: 'XII IPA 1' },
    { id: 'guru', pin: '1234', name: 'Drs. Abdul Rouf', role: 'guru', refId: 'PEG-004' },
    { id: 'walimurid', pin: '1234', name: 'Bpk. H. Sulaiman (Wali Ahmad)', role: 'walimurid', refId: '0074519821' }
  ],
  kelasList: [
    { id: 'K1', nama: 'X IPA 1', waliKelasId: 'PEG-005', waliKelasNama: 'Ust. M. Ridwan, S.Pd.I', waWaliKelas: '6281228001105' },
    { id: 'K2', nama: 'XI IPS 1', waliKelasId: 'PEG-006', waliKelasNama: 'Ustzh. Nurul Hidayah, S.Ag', waWaliKelas: '6281228001106' },
    { id: 'K3', nama: 'XII IPA 1', waliKelasId: 'PEG-003', waliKelasNama: 'Ustzh. Siti Aminah, S.Pd', waWaliKelas: '6281228001103' }
  ],
  siswa: [
    { nisn: '0074519821', nama: 'Ahmad Zaki Al-Fatih', kelas: 'XII IPA 1', wali: 'Bpk. H. Sulaiman', waWali: '6281234567801' },
    { nisn: '0074519822', nama: 'Aisyah Putri Ramadhani', kelas: 'XII IPA 1', wali: 'Ibu Hj. Fatimah', waWali: '6281234567802' },
    { nisn: '0081122334', nama: 'Muhammad Ilham Maulana', kelas: 'XI IPS 1', wali: 'Bpk. Budi Santoso', waWali: '6281234567803' },
    { nisn: '0095566778', nama: 'Zahra Nabila Khairunnisa', kelas: 'X IPA 1', wali: 'Bpk. Hendra Wijaya', waWali: '6281234567804' }
  ],
  pegawai: [
    { pegId: 'PEG-001', nama: 'M. Khoirul Anam, S.Kom', jabatan: 'Admin / Operator TU', unit: 'Tata Usaha', wa: '6281228001101' },
    { pegId: 'PEG-002', nama: 'Ust. Syamsul Maarif, S.Pd', jabatan: 'Guru Fiqih / Piket', unit: 'Pendidik', wa: '6281228001102' }
  ],
  absensi: [], izinRequests: [], waLogs: [],
  waConfig: {
    sendMode: 'direct_wa', endpoint: 'https://api.fonnte.com/send', apiKey: '', autoRealtime: true,
    tplMasuk: 'Assalamualaikum Wr. Wb. Yth. *{nama_wali}*, ananda *{nama_siswa}* (Kelas {kelas}) telah melakukan *ABSEN MASUK* di {sekolah} tanggal {tanggal} pukul *{jam} WIB* ({status}).',
    tplPulang: 'Assalamualaikum Wr. Wb. Yth. *{nama_wali}*, ananda *{nama_siswa}* (Kelas {kelas}) telah *ABSEN PULANG* dari {sekolah} pukul *{jam} WIB*.'
  }
};
function getTodayStr() { return new Date().toISOString().split('T')[0]; }
function getTimeStr() { return new Date().toTimeString().slice(0, 5); }
function normalizeWA(p) { let c = String(p||'').replace(/[^0-9]/g,''); if (c.startsWith('0')) c='62'+c.slice(1); return c; }
let db = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || JSON.parse(JSON.stringify(defaultData));
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }
fetch('./data/master-data.json').then(r => r.ok ? r.json() : null).then(ext => {
  if (ext && !localStorage.getItem(STORAGE_KEY)) {
    if (ext.school) db.school = Object.assign({}, db.school, ext.school);
    if (ext.kelasList) db.kelasList = ext.kelasList;
    if (ext.siswa) db.siswa = ext.siswa;
    if (ext.pegawai) db.pegawai = ext.pegawai;
    saveState(); render();
  }
}).catch(() => {});

let currentUser = null, activeTab = 'dashboard', kioskLocked = false, scanMode = 'masuk', scanFeedback = null;
function loginAs(id, pin) { const u = db.users.find(x => x.id === id.trim().toLowerCase() && x.pin === pin.trim()); if (!u) return alert('ID atau PIN salah!'); currentUser = u; activeTab = u.role === 'piket' ? 'scan' : 'dashboard'; render(); }
function logout() { currentUser = null; render(); }
function toggleKioskLock() {
  if (!kioskLocked) { kioskLocked = true; activeTab = 'scan'; render(); }
  else { const p = prompt('Masukkan PIN Kunci Kios:'); if (p === db.school.kioskPin) { kioskLocked = false; render(); } else if (p !== null) alert('PIN salah!'); }
}
function processScan(raw) {
  const code = String(raw||'').trim(); if (!code) return;
  const s = db.siswa.find(x => x.nisn === code);
  const p = db.pegawai.find(x => x.pegId.toLowerCase() === code.toLowerCase());
  if (!s && !p) { scanFeedback = { ok: false, title: 'Tidak Terdaftar', msg: code + ' tidak ditemukan.' }; render(); return; }
  const today = getTodayStr(), jam = getTimeStr(), kode = s ? s.nisn : p.pegId, nama = s ? s.nama : p.nama, tipe = s ? 'Siswa' : 'Guru/Tendik', unit = s ? s.kelas : p.unit;
  let ex = db.absensi.find(a => a.tanggal === today && a.kode === kode);
  if (scanMode === 'masuk') {
    if (ex && ex.jamMasuk) { scanFeedback = { ok: false, title: 'Sudah Absen Masuk', msg: nama + ' pukul ' + ex.jamMasuk }; render(); return; }
    if (ex) ex.jamMasuk = jam; else db.absensi.unshift({ id: 'ABS-'+Date.now(), tanggal: today, kode, nama, tipe, kelasUnit: unit, jamMasuk: jam, jamPulang: '', status: 'Hadir' });
    scanFeedback = { ok: true, title: 'Absen Masuk Berhasil', msg: nama + ' (' + jam + ' WIB)' };
  } else {
    if (!ex || !ex.jamMasuk) { scanFeedback = { ok: false, title: 'Belum Absen Masuk', msg: nama }; render(); return; }
    ex.jamPulang = jam;
    scanFeedback = { ok: true, title: 'Absen Pulang Berhasil', msg: nama + ' (' + jam + ' WIB)' };
  }
  saveState(); render();
}
function render() {
  const app = document.getElementById('app');
  if (!currentUser) {
    app.innerHTML = `<div class="min-h-screen bg-emerald-900 flex items-center justify-center p-4"><div class="bg-white max-w-md w-full rounded-3xl p-6 shadow-xl space-y-4"><h1 class="text-xl font-extrabold text-emerald-900 text-center">${db.school.name}</h1><input id="lid" placeholder="ID (admin / piket)" class="w-full px-4 py-3 border rounded-xl text-sm"/><input id="lpin" type="password" placeholder="PIN (1234)" class="w-full px-4 py-3 border rounded-xl text-sm"/><button onclick="loginAs(document.getElementById('lid').value, document.getElementById('lpin').value)" class="w-full py-3 bg-emerald-700 text-white font-bold rounded-xl">Masuk</button><div class="grid grid-cols-2 gap-2 text-xs"><button onclick="loginAs('admin','1234')" class="p-2.5 bg-slate-100 rounded-xl font-bold">🛡️ Admin</button><button onclick="loginAs('piket','1234')" class="p-2.5 bg-slate-100 rounded-xl font-bold">📷 Piket</button></div></div></div>`;
    return;
  }
  app.innerHTML = `<div class="min-h-screen flex flex-col"><header class="bg-white border-b px-4 py-3 flex justify-between items-center"><div class="font-extrabold text-emerald-900">${db.school.name}</div><div class="flex gap-2"><button onclick="toggleKioskLock()" class="px-3 py-1.5 bg-slate-100 rounded-xl text-xs font-bold">${kioskLocked ? '🔒 Terkunci' : '🔓 Kios'}</button>${!kioskLocked ? `<button onclick="logout()" class="px-3 py-1.5 bg-rose-50 text-rose-700 rounded-xl text-xs font-bold">Keluar</button>` : ''}</div></header><main class="max-w-4xl w-full mx-auto p-4 space-y-4"><div class="flex gap-2">${!kioskLocked ? `<button onclick="activeTab='dashboard';render();" class="px-4 py-2 rounded-xl text-xs font-bold ${activeTab==='dashboard'?'bg-emerald-700 text-white':'bg-white border'}">Beranda</button>` : ''}<button onclick="activeTab='scan';render();" class="px-4 py-2 rounded-xl text-xs font-bold ${activeTab==='scan'?'bg-emerald-700 text-white':'bg-white border'}">Scan Kios</button></div>${(kioskLocked || activeTab==='scan') ? `<div class="bg-white p-5 rounded-2xl border space-y-3"><h2 class="font-extrabold">Scan NISN / PegID</h2><div class="flex gap-2"><button onclick="scanMode='masuk';render();" class="px-3 py-1.5 rounded-lg text-xs font-bold ${scanMode==='masuk'?'bg-emerald-700 text-white':'bg-slate-100'}">MASUK</button><button onclick="scanMode='pulang';render();" class="px-3 py-1.5 rounded-lg text-xs font-bold ${scanMode==='pulang'?'bg-indigo-700 text-white':'bg-slate-100'}">PULANG</button></div>${scanFeedback ? `<div class="p-3 rounded-xl ${scanFeedback.ok?'bg-emerald-50 text-emerald-900':'bg-rose-50 text-rose-900'} text-xs font-bold">${scanFeedback.title}: ${scanFeedback.msg}</div>` : ''}<form onsubmit="event.preventDefault();processScan(document.getElementById('scode').value);document.getElementById('scode').value='';" class="flex gap-2"><input id="scode" placeholder="Ketik/scan NISN (misal 0074519821)" class="flex-1 px-4 py-2.5 border rounded-xl text-sm"/><button class="px-4 py-2.5 bg-emerald-700 text-white font-bold rounded-xl text-xs">Proses</button></form></div>` : `<div class="bg-white p-5 rounded-2xl border space-y-2"><h2 class="font-extrabold">Rekap Hari Ini (${getTodayStr()})</h2>${db.absensi.map(a=>`<div class="p-2.5 border-b text-xs flex justify-between"><span><b>${a.nama}</b> (${a.kode})</span><span>Masuk: ${a.jamMasuk||'-'} | Pulang: ${a.jamPulang||'-'}</span></div>`).join('') || '<p class="text-xs text-slate-500">Belum ada absensi.</p>'}</div>`}</main></div>`;
}
render();
</script>
</body>
</html>
